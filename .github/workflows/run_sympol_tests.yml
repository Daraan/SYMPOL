# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main", "rllib/port" ]
  pull_request:
    branches: [ "main", "rllib/port" ]

permissions:
  contents: read

jobs:
  test_basic:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          persist-credentials: false
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
    - name: Test Basic
      run: |
        source .venv/bin/activate
        pytest -vx -k "not test_trainable_port and not test_tuner_integration and not test_pbt_port and not TestMetricsRestored"
      env:
        COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
  test_metrics_restore:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          persist-credentials: false
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
        install-args: '.'
    - name: Test Basic
      run: |
        source .venv/bin/activate
        pytest -v -k "TestMetricsRestored"
      env:
        COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
  test_integration2:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          persist-credentials: false
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
        install-args: '.'
    - name: Test Tuner and PBT integration
      run: |
        source .venv/bin/activate
        pytest -vx -k "test_tuner_integration or test_pbt_port"
      env:
        COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
  test_integration_fast:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          persist-credentials: false
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
        install-args: '.'

    - name: Test Integration Checkpointing (fast)
      run: |
        source .venv/bin/activate
        pytest -kv -k "test_trainable_port and not test_tuner_checkpointing" --timeout=600 --fast
    - name: Test Tuner Checkpointing (fast)
      run: |
        source .venv/bin/activate
        pytest -kv tests/test_trainable_port.py::TestClassCheckpointing::test_tuner_checkpointing -v --fast --timeout_method=thread
  test_integration_mp:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          persist-credentials: false
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
        install-args: '.'

    - name: Test Integration Checkpointing (mp-only)
      run: |
        source .venv/bin/activate
        pytest -kv -k "test_trainable_port and not test_tuner_checkpointing and not test_fork_from_restore and not test_validate_save_restore and not test_perturbed_keys" --timeout=600 --mp-only
    - name: Test Tuner Checkpointing (mp)
      run: |
        source .venv/bin/activate
        pytest -kv tests/test_trainable_port.py::TestClassCheckpointing::test_tuner_checkpointing -v --mp-only --timeout_method=thread
