# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main", "rllib/port" ]
  pull_request:
    branches: [ "main", "rllib/port" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Python setup and install
      uses: ./.github/actions/cached-python-setup
      with:
        python-version: '3.10'
        use-pip-cache: true
        install-args: '.'
    - name: Test with pytest (main tests)
      run: |
        source .venv/bin/activate
        pytest -k "not standalone and not checkpoint and not ray_utilities and not test_learner"  --timeout=600
    - name: Test with pytest (learner tests)
      run: |
        source .venv/bin/activate
        pytest -k "test_learner and not ray_utilities"  --timeout=600
